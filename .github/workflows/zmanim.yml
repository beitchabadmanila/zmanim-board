name: Refresh zmanim
on:
  schedule:
    - cron: "30 17 * * *"
    - cron: "45 20 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch zmanim.org.il (Manila)
        run: |
          curl -fsS --retry 5 --retry-delay 20 "https://zmanei-halacha-backend.onrender.com/api/zmanim/asia/Filipinas,%20Manila" -o new.json
          python3 -c "import json;d=json.load(open('new.json'));assert d['success'] and d['data']['zmanim']['alotHashachar'] and d['dateInfo']['gregorianDate']"
          mv new.json zmanim.json
      - name: Commit if changed
        run: |
          git config user.name "zmanim-bot"
          git config user.email "zmanim-bot@users.noreply.github.com"
          git add zmanim.json
          git diff --cached --quiet || (git commit -m "Refresh zmanim.json from zmanim.org.il" && git push)
