name: Bake daily zmanim

on:
  schedule:
    # 00:05 Asia/Manila (UTC+8) every day
    - cron: "5 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch zmanim.org.il for Manila (Chabad / Admor HaZaken)
        run: |
          curl -fsSL --retry 4 --retry-delay 30 --retry-all-errors --max-time 180 \
            "https://zmanei-halacha-backend.onrender.com/api/zmanim/asia/Filipinas%2C%20Manila" \
            -o zmanim.new.json
          python3 - <<'PY'
          import json
          d = json.load(open("zmanim.new.json"))
          assert d.get("success") and d["data"]["zmanim"], "unexpected payload"
          json.dump(d, open("zmanim.json", "w"), ensure_ascii=False, indent=2)
          PY
      - name: Commit if changed
        run: |
          git config user.name "zmanim-bake"
          git config user.email "zmanim-bake@users.noreply.github.com"
          git add zmanim.json
          git diff --cached --quiet && echo "no change" || git commit -m "chore: daily zmanim bake"
          git push
